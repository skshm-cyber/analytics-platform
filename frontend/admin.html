<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Insightly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.06);
      --accent: #8b5cf6;
      --text: #fafafa;
      --dim: #a1a1aa;
      --muted: #52525b;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: var(--dim); margin-bottom: 32px; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px; margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }

    .site-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .site-row:last-child { border-bottom: none; }
    .site-name { font-weight: 500; }
    .site-url { font-size: 12px; color: var(--dim); }
    .site-key {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px; color: var(--muted);
      background: rgba(255,255,255,0.04);
      padding: 2px 8px; border-radius: 4px;
    }

    .btn {
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text); font-family: var(--sans);
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { border-color: rgba(255,255,255,0.15); }
    .btn-accent {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .btn-accent:hover { background: #7c3aed; }

    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-row input {
      flex: 1; min-width: 200px;
      padding: 8px 12px; border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); font-family: var(--sans); font-size: 13px;
      outline: none;
    }
    .form-row input:focus { border-color: var(--accent); }

    .msg { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-top: 8px; }
    .msg-ok { background: rgba(34,197,94,0.1); color: #22c55e; }
    .msg-err { background: rgba(239,68,68,0.1); color: #ef4444; }

    .empty { color: var(--muted); font-size: 13px; padding: 16px 0; }

    .user-info { font-size: 13px; color: var(--dim); margin-bottom: 24px; }
    .user-info strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin</h1>
    <p class="subtitle">Manage your account and sites</p>

    <div class="user-info" id="userInfo">Loading...</div>

    <div class="card">
      <h2>Your Sites</h2>
      <div id="sitesList"><div class="empty">Loading...</div></div>
    </div>

    <div class="card">
      <h2>Add New Site</h2>
      <div class="form-row">
        <input type="text" id="siteName" placeholder="Site name (e.g., My Store)">
        <input type="url" id="siteUrl" placeholder="Website URL (https://...)">
      </div>
      <button class="btn btn-accent" id="addSiteBtn">Add Site</button>
      <div id="addSiteMsg"></div>
    </div>

    <div class="card">
      <h2>Account</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="dashboardBtn">Open Dashboard</button>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

<script>
var API = window.location.origin;

function api(path, opts) {
  return fetch(API + path, Object.assign({ credentials: 'include' }, opts || {})).then(function(r) {
    if (r.status === 401) throw new Error('unauthorized');
    return r.json();
  });
}

function loadUser() {
  api('/api/auth/me').then(function(user) {
    document.getElementById('userInfo').innerHTML = 'Logged in as <strong>' + (user.name || user.email) + '</strong> (' + user.email + ')';
    loadSites();
  }).catch(function() { window.location.href = '/login.html'; });
}

function loadSites() {
  api('/api/sites').then(function(data) {
    var sites = data.sites || [];
    var el = document.getElementById('sitesList');
    if (sites.length === 0) { el.innerHTML = '<div class="empty">No sites yet. Add one above.</div>'; return; }
    el.innerHTML = '';
    sites.forEach(function(s) {
      var row = document.createElement('div');
      row.className = 'site-row';
      row.innerHTML = '<div><div class="site-name">' + s.name + '</div>'
        + '<div class="site-url">' + s.url + '</div></div>'
        + '<div class="site-key">' + s.site_key.substring(0, 12) + '…</div>';
      el.appendChild(row);
    });
  });
}

document.getElementById('addSiteBtn').addEventListener('click', function() {
  var name = document.getElementById('siteName').value.trim();
  var url = document.getElementById('siteUrl').value.trim();
  var msg = document.getElementById('addSiteMsg');
  if (!name || !url) { msg.className = 'msg msg-err'; msg.textContent = 'Name and URL required'; return; }
  api('/api/sites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, url: url }) })
    .then(function(d) {
      if (d.error) { msg.className = 'msg msg-err'; msg.textContent = d.error; return; }
      msg.className = 'msg msg-ok'; msg.textContent = 'Site added! Site key: ' + d.site_key;
      document.getElementById('siteName').value = '';
      document.getElementById('siteUrl').value = '';
      loadSites();
    })
    .catch(function(e) { msg.className = 'msg msg-err'; msg.textContent = 'Error: ' + e.message; });
});

document.getElementById('dashboardBtn').addEventListener('click', function() { window.location.href = '/dashboard.html'; });
document.getElementById('logoutBtn').addEventListener('click', function() {
  fetch(API + '/api/auth/logout', { method: 'POST', credentials: 'include' })
    .then(function() { window.location.href = '/login.html'; });
});

loadUser();
</script>
</body>
</html>
