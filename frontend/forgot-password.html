<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Insightly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b; color: #fafafa; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #a1a1aa; text-decoration: none; margin-bottom: 1.5rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #fafafa; }
    .back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .logo { display: flex; align-items: center; gap: 0.625rem; margin-bottom: 2rem; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: #fff; flex-shrink: 0;
    }
    .logo-text { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.375rem; letter-spacing: -0.03em; }
    .subtitle { color: #a1a1aa; font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; color: #a1a1aa; }
    input {
      width: 100%; padding: 0.625rem 0.875rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: #fafafa; font-family: inherit; font-size: 0.875rem; outline: none;
      transition: border-color 0.15s; margin-bottom: 1rem;
    }
    input:focus { border-color: #8b5cf6; }
    input::placeholder { color: #52525b; }
    .btn {
      width: 100%; padding: 0.625rem; border-radius: 10px; border: none;
      background: #8b5cf6; color: #fff; font-family: inherit; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 0.25rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      display: none; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5; font-size: 0.8125rem; padding: 0.625rem 0.875rem;
      border-radius: 10px; margin-bottom: 1rem;
    }
    .error.visible { display: block; }
    .success {
      display: none; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2);
      color: #86efac; font-size: 0.8125rem; padding: 0.625rem 0.875rem;
      border-radius: 10px; margin-bottom: 1rem;
    }
    .success.visible { display: block; }
    .reset-link-box {
      display: none; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 0.75rem; margin-bottom: 1rem; word-break: break-all;
      font-family: 'SF Mono', monospace; font-size: 11px; color: #a1a1aa;
    }
    .footer { text-align: center; margin-top: 1.25rem; font-size: 0.8125rem; color: #a1a1aa; }
    .footer a { color: #8b5cf6; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/login.html" class="back-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to login
    </a>
    <div class="logo">
      <div class="logo-icon">i</div>
      <span class="logo-text">insightly</span>
    </div>
    <h1>Reset your password</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>
    <div class="error" id="error"></div>
    <div class="success" id="success">If an account exists with that email, a reset link has been sent.</div>
    <div class="reset-link-box" id="resetLinkBox">
      <div style="margin-bottom:6px;color:#fafafa;font-weight:600;font-family:Inter,sans-serif;font-size:13px;">Dev mode — your reset link:</div>
      <a id="resetLink" href="#" style="color:#8b5cf6;text-decoration:underline;"></a>
    </div>
    <form id="form">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <button class="btn" type="submit" id="submitBtn">Send Reset Link</button>
    </form>
    <p class="footer">Remember your password? <a href="/login.html">Login</a></p>
  </div>
  <script>
    var API = window.location.origin;
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('error');
      var succ = document.getElementById('success');
      var linkBox = document.getElementById('resetLinkBox');
      err.classList.remove('visible');
      succ.classList.remove('visible');
      linkBox.style.display = 'none';
      btn.disabled = true; btn.textContent = 'Sending…';
      fetch(API + '/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          succ.classList.add('visible');
          if (d.reset_url) {
            var link = document.getElementById('resetLink');
            link.href = d.reset_url;
            link.textContent = d.reset_url;
            linkBox.style.display = 'block';
          }
          btn.disabled = false; btn.textContent = 'Send Reset Link';
        })
        .catch(function(e) {
          err.textContent = e.message || 'Something went wrong';
          err.classList.add('visible');
          btn.disabled = false; btn.textContent = 'Send Reset Link';
        });
    });
  </script>
</body>
</html>
