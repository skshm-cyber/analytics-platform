<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Insightly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b; color: #fafafa; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #a1a1aa; text-decoration: none; margin-bottom: 1.5rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: #fafafa; }
    .back-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
    .logo {
      display: flex; align-items: center; gap: 0.625rem; margin-bottom: 2rem;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: #fff; flex-shrink: 0;
    }
    .logo-text { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.375rem; letter-spacing: -0.03em; }
    .subtitle { color: #a1a1aa; font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; color: #a1a1aa; }
    input {
      width: 100%; padding: 0.625rem 0.875rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: #fafafa; font-family: inherit; font-size: 0.875rem; outline: none;
      transition: border-color 0.15s; margin-bottom: 1rem;
    }
    input:focus { border-color: #8b5cf6; }
    input::placeholder { color: #52525b; }
    .btn {
      width: 100%; padding: 0.625rem; border-radius: 10px; border: none;
      background: #8b5cf6; color: #fff; font-family: inherit; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 0.25rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 1.25rem 0; font-size: 12px; color: #52525b;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
    }
    .social-btn {
      width: 100%; padding: 0.625rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: #fafafa; font-family: inherit; font-size: 0.875rem; font-weight: 500;
      cursor: pointer; transition: all 0.15s; display: flex; align-items: center;
      justify-content: center; gap: 8px; margin-bottom: 0.75rem;
    }
    .social-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .social-btn svg { width: 18px; height: 18px; }
    .error {
      display: none; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5; font-size: 0.8125rem; padding: 0.625rem 0.875rem;
      border-radius: 10px; margin-bottom: 1rem;
    }
    .error.visible { display: block; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .row a { color: #8b5cf6; text-decoration: none; font-size: 0.8125rem; font-weight: 500; }
    .row a:hover { text-decoration: underline; }
    .footer { text-align: center; margin-top: 1.25rem; font-size: 0.8125rem; color: #a1a1aa; }
    .footer a { color: #8b5cf6; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="back-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to home
    </a>
    <div class="logo">
      <div class="logo-icon">i</div>
      <span class="logo-text">insightly</span>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>
    <div class="error" id="error"></div>

    <button class="social-btn" onclick="socialLogin('google')">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" onclick="socialLogin('github')">
      <svg viewBox="0 0 24 24" fill="#fafafa"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
      Continue with GitHub
    </button>

    <div class="divider">or</div>

    <form id="form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required>
      <div class="row">
        <span></span>
        <a href="/forgot-password.html">Forgot password?</a>
      </div>
      <button class="btn" type="submit" id="submitBtn">Login</button>
    </form>
    <p class="footer">Don't have an account? <a href="/signup.html">Sign up</a></p>
  </div>
  <script>
    var API = window.location.origin;
    (function checkAuth() {
      fetch(API + '/api/auth/me', { credentials: 'include' })
        .then(function(r) { if (r.ok) window.location.href = '/dashboard.html'; })
        .catch(function() {});
    })();
    function socialLogin(provider) {
      window.location.href = API + '/api/auth/' + provider;
    }
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('error');
      err.classList.remove('visible');
      btn.disabled = true; btn.textContent = 'Signing in…';
      fetch(API + '/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
        .then(function(r) {
          if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Invalid credentials'); });
          return r.json();
        })
        .then(function() { window.location.href = '/dashboard.html'; })
        .catch(function(e) {
          err.textContent = e.message; err.classList.add('visible');
          btn.disabled = false; btn.textContent = 'Login';
        });
    });
  </script>
</body>
</html>
