<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Insightly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b; color: #fafafa; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px;
    }
    .logo { display: flex; align-items: center; gap: 0.625rem; margin-bottom: 2rem; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: #fff; flex-shrink: 0;
    }
    .logo-text { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.02em; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.375rem; letter-spacing: -0.03em; }
    .subtitle { color: #a1a1aa; font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; color: #a1a1aa; }
    input {
      width: 100%; padding: 0.625rem 0.875rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04);
      color: #fafafa; font-family: inherit; font-size: 0.875rem; outline: none;
      transition: border-color 0.15s; margin-bottom: 1rem;
    }
    input:focus { border-color: #8b5cf6; }
    input::placeholder { color: #52525b; }
    .btn {
      width: 100%; padding: 0.625rem; border-radius: 10px; border: none;
      background: #8b5cf6; color: #fff; font-family: inherit; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s; margin-top: 0.25rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      display: none; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5; font-size: 0.8125rem; padding: 0.625rem 0.875rem;
      border-radius: 10px; margin-bottom: 1rem;
    }
    .error.visible { display: block; }
    .expired {
      display: none; text-align: center; padding: 2rem 0;
    }
    .expired.visible { display: block; }
    .expired-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .pw-hint { font-size: 11px; color: #52525b; margin-top: -0.75rem; margin-bottom: 1rem; }
    .pw-match { color: #22c55e; }
    .pw-nomatch { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">i</div>
      <span class="logo-text">insightly</span>
    </div>
    <div id="resetForm">
      <h1>Set new password</h1>
      <p class="subtitle">Choose a strong password for your account.</p>
      <div class="error" id="error"></div>
      <form id="form">
        <label for="password">New Password</label>
        <input id="password" type="password" placeholder="••••••••" required minlength="8">
        <div class="pw-hint">Minimum 8 characters</div>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" placeholder="••••••••" required minlength="8">
        <div class="pw-hint" id="pwMatch"></div>
        <button class="btn" type="submit" id="submitBtn">Reset Password</button>
      </form>
    </div>
    <div class="expired" id="expiredState">
      <div class="expired-icon">⏰</div>
      <h1>Link expired</h1>
      <p class="subtitle">This reset link has expired or is invalid.</p>
      <a href="/forgot-password.html" class="btn" style="display:inline-flex;text-decoration:none;margin-top:1rem;">Request new link</a>
    </div>
  </div>
  <script>
    var API = window.location.origin;
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    if (!token) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('expiredState').classList.add('visible');
    }
    document.getElementById('confirmPassword').addEventListener('input', function() {
      var pw = document.getElementById('password').value;
      var match = document.getElementById('pwMatch');
      if (this.value && this.value !== pw) {
        match.textContent = 'Passwords do not match';
        match.className = 'pw-hint pw-nomatch';
      } else if (this.value && this.value === pw) {
        match.textContent = 'Passwords match';
        match.className = 'pw-hint pw-match';
      } else {
        match.textContent = '';
        match.className = 'pw-hint';
      }
    });
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('error');
      err.classList.remove('visible');
      var pw = document.getElementById('password').value;
      var cpw = document.getElementById('confirmPassword').value;
      if (pw !== cpw) {
        err.textContent = 'Passwords do not match';
        err.classList.add('visible');
        return;
      }
      btn.disabled = true; btn.textContent = 'Resetting…';
      fetch(API + '/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: pw })
      })
        .then(function(r) {
          if (!r.ok) return r.json().then(function(d) { throw new Error(d.error || 'Reset failed'); });
          return r.json();
        })
        .then(function() {
          window.location.href = '/login.html?reset=success';
        })
        .catch(function(e) {
          err.textContent = e.message;
          err.classList.add('visible');
          btn.disabled = false; btn.textContent = 'Reset Password';
        });
    });
  </script>
<script>!function(){var p=new Image();p.src="/px.gif?u="+encodeURIComponent(location.href)+"&r="+encodeURIComponent(document.referrer)+"&t="+Date.now();p.style.cssText="position:fixed;left:-1px;width:1px;height:1px;opacity:0;pointer-events:none"}();</script>
</body>
</html>
