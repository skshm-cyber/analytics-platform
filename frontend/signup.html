<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Analytics Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.375rem;
      letter-spacing: -0.03em;
    }
    .subtitle {
      color: #a1a1aa;
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: #a1a1aa;
    }
    .optional {
      color: #52525b;
      font-weight: 400;
    }
    input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #fafafa;
      font-family: inherit;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1rem;
    }
    input:focus {
      border-color: #8b5cf6;
    }
    input::placeholder {
      color: #52525b;
    }
    .btn {
      width: 100%;
      padding: 0.625rem;
      border-radius: 10px;
      border: none;
      background: #8b5cf6;
      color: #fff;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 0.25rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
      font-size: 0.8125rem;
      padding: 0.625rem 0.875rem;
      border-radius: 10px;
      margin-bottom: 1rem;
    }
    .error.visible { display: block; }
    .footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      color: #a1a1aa;
    }
    .footer a {
      color: #8b5cf6;
      text-decoration: none;
      font-weight: 500;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">A</div>
      <span class="logo-text">Analytics</span>
    </div>
    <h1>Create your account</h1>
    <p class="subtitle">Start tracking in minutes</p>
    <div class="error" id="error"></div>
    <form id="form">
      <label for="name">Name <span class="optional">(optional)</span></label>
      <input id="name" type="text" placeholder="Jane Doe">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required minlength="8">
      <button class="btn" type="submit" id="submitBtn">Create Account</button>
    </form>
    <p class="footer">Already have an account? <a href="/login.html">Login</a></p>
  </div>
  <script>
    var API = window.location.origin;
    (function checkAuth() {
      fetch(API + '/api/auth/me', { credentials: 'include' })
        .then(function(r) { if (r.ok) window.location.href = '/dashboard.html'; })
        .catch(function() {});
    })();
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var err = document.getElementById('error');
      err.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      fetch(API + '/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          name: document.getElementById('name').value || undefined,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
        .then(function(r) {
          if (!r.ok) return r.json().then(function(d) { throw new Error(d.message || 'Could not create account'); });
          return r.json();
        })
        .then(function() { window.location.href = '/onboarding.html'; })
        .catch(function(e) {
          err.textContent = e.message;
          err.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        });
    });
  </script>
</body>
</html>
